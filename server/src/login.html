<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex" />
	<title>Sign in · GlitchOps</title>
	<style>
		:root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #17181c; --muted: #5d6270; --accent: #3c6df0; }
		@media (prefers-color-scheme: dark) { :root { --bg: #17181c; --card: #22242a; --text: #eceef2; --muted: #a0a5b1; --accent: #7b9cff; } }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
		main { background: var(--card); padding: 2.5rem 2rem; border-radius: 12px; width: min(22rem, calc(100vw - 2rem)); box-sizing: border-box; text-align: center; box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
		h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
		p { margin: 0 0 1.5rem; color: var(--muted); }
		button { width: 100%; padding: 0.75rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
		button:disabled { opacity: 0.6; cursor: wait; }
		#status { min-height: 1.5rem; margin: 1rem 0 0; }
	</style>
</head>
<body>
	<main>
		<h1>GlitchOps</h1>
		<p>Sign in to read the wiki.</p>
		<button id="signin" type="button">Sign in with Google</button>
		<p id="status" role="status"></p>
	</main>
	<script type="module">
		import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
		import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, setPersistence, inMemoryPersistence } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';

		const auth = getAuth(initializeApp(__FIREBASE_CONFIG__));
		// The server session cookie is the only session; don't keep Firebase tokens in the browser.
		await setPersistence(auth, inMemoryPersistence);

		const button = document.getElementById('signin');
		const status = document.getElementById('status');
		const next = new URLSearchParams(location.search).get('next') || '/';

		button.addEventListener('click', async () => {
			button.disabled = true;
			status.textContent = '';
			try {
				// Always show the account chooser — with several Google accounts in the browser, Google
				// would otherwise silently pick the first one.
				const provider = new GoogleAuthProvider();
				provider.setCustomParameters({ prompt: 'select_account' });
				const { user } = await signInWithPopup(auth, provider);
				const response = await fetch('/__auth/session', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ idToken: await user.getIdToken() }),
				});
				await signOut(auth);
				if (response.ok) {
					// The server validates `next` again on the following request; only same-site paths are used.
					location.replace(next.startsWith('/') && !next.startsWith('//') ? next : '/');
					return;
				}
				status.textContent = response.status === 403 ? 'This account has no access to the wiki.' : 'Sign-in failed, please try again.';
			} catch {
				status.textContent = 'Sign-in was cancelled or failed.';
			}
			button.disabled = false;
		});
	</script>
</body>
</html>
